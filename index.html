<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>語音即時翻譯</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Noto+Sans+TC:wght@300;400;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0a0f;
    --surface: #12121a;
    --card: #1a1a26;
    --border: #2a2a3e;
    --accent: #00e5ff;
    --accent2: #7c3aed;
    --accent3: #f59e0b;
    --text: #e2e8f0;
    --muted: #64748b;
    --danger: #ef4444;
    --success: #22c55e;
    --glow: 0 0 20px rgba(0,229,255,0.3);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Noto Sans TC', sans-serif;
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* Animated background grid */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image:
      linear-gradient(rgba(0,229,255,0.03) 1px, transparent 1px),
      linear-gradient(90deg, rgba(0,229,255,0.03) 1px, transparent 1px);
    background-size: 40px 40px;
    pointer-events: none;
    z-index: 0;
  }

  .container {
    position: relative;
    z-index: 1;
    max-width: 900px;
    margin: 0 auto;
    padding: 2rem 1.5rem 4rem;
  }

  /* Header */
  header {
    text-align: center;
    margin-bottom: 3rem;
    animation: fadeDown 0.6s ease;
  }

  .logo {
    display: inline-flex;
    align-items: center;
    gap: 0.5rem;
    margin-bottom: 1rem;
  }

  .logo-icon {
    width: 40px; height: 40px;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    border-radius: 10px;
    display: flex; align-items: center; justify-content: center;
    font-size: 1.2rem;
  }

  h1 {
    font-family: 'Space Mono', monospace;
    font-size: clamp(1.4rem, 4vw, 2rem);
    font-weight: 700;
    letter-spacing: -0.02em;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }

  .subtitle {
    color: var(--muted);
    font-size: 0.85rem;
    margin-top: 0.4rem;
    font-family: 'Space Mono', monospace;
  }

  /* Language selectors */
  .lang-bar {
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    align-items: center;
    gap: 1rem;
    margin-bottom: 1.5rem;
    animation: fadeUp 0.6s 0.1s both;
  }

  .lang-select-wrap {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 0.75rem 1rem;
    display: flex;
    flex-direction: column;
    gap: 0.3rem;
  }

  .lang-label {
    font-size: 0.65rem;
    color: var(--muted);
    font-family: 'Space Mono', monospace;
    text-transform: uppercase;
    letter-spacing: 0.1em;
  }

  select {
    background: transparent;
    border: none;
    color: var(--text);
    font-size: 0.95rem;
    font-family: 'Noto Sans TC', sans-serif;
    font-weight: 700;
    outline: none;
    cursor: pointer;
    width: 100%;
    appearance: none;
  }

  select option { background: var(--surface); }

  .swap-btn {
    width: 44px; height: 44px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 50%;
    color: var(--accent);
    font-size: 1.1rem;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: all 0.2s;
    flex-shrink: 0;
  }

  .swap-btn:hover {
    background: var(--accent);
    color: var(--bg);
    border-color: var(--accent);
    box-shadow: var(--glow);
    transform: rotate(180deg);
  }

  /* Main panels */
  .panels {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 1rem;
    margin-bottom: 1.5rem;
    animation: fadeUp 0.6s 0.2s both;
  }

  @media (max-width: 600px) {
    .panels { grid-template-columns: 1fr; }
  }

  .panel {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 1.25rem;
    min-height: 200px;
    display: flex;
    flex-direction: column;
    gap: 0.75rem;
    transition: border-color 0.3s;
    position: relative;
    overflow: hidden;
  }

  .panel.active {
    border-color: var(--accent);
    box-shadow: 0 0 0 1px rgba(0,229,255,0.1), inset 0 0 30px rgba(0,229,255,0.03);
  }

  .panel-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  .panel-title {
    font-family: 'Space Mono', monospace;
    font-size: 0.7rem;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.12em;
  }

  .panel-actions {
    display: flex;
    gap: 0.4rem;
  }

  .icon-btn {
    width: 30px; height: 30px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--muted);
    cursor: pointer;
    font-size: 0.8rem;
    display: flex; align-items: center; justify-content: center;
    transition: all 0.15s;
  }

  .icon-btn:hover { color: var(--accent); border-color: var(--accent); }

  .text-area {
    flex: 1;
    background: transparent;
    border: none;
    color: var(--text);
    font-family: 'Noto Sans TC', sans-serif;
    font-size: 1rem;
    line-height: 1.7;
    resize: none;
    outline: none;
    min-height: 140px;
  }

  .text-area::placeholder { color: var(--muted); font-size: 0.9rem; }

  .translated-text {
    flex: 1;
    min-height: 140px;
    font-size: 1rem;
    line-height: 1.7;
    color: var(--text);
  }

  .translated-text.loading {
    color: var(--accent);
    opacity: 0.6;
  }

  .translated-text.placeholder {
    color: var(--muted);
    font-size: 0.9rem;
  }

  /* Typing cursor */
  .cursor {
    display: inline-block;
    width: 2px;
    height: 1em;
    background: var(--accent);
    margin-left: 2px;
    animation: blink 0.8s infinite;
    vertical-align: text-bottom;
  }

  /* Record button */
  .controls {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 1rem;
    animation: fadeUp 0.6s 0.3s both;
  }

  .record-btn {
    position: relative;
    width: 80px; height: 80px;
    background: var(--card);
    border: 2px solid var(--border);
    border-radius: 50%;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: all 0.3s;
    font-size: 1.8rem;
  }

  .record-btn:hover {
    border-color: var(--accent);
    box-shadow: var(--glow);
  }

  .record-btn.recording {
    background: rgba(239,68,68,0.15);
    border-color: var(--danger);
    box-shadow: 0 0 30px rgba(239,68,68,0.4);
    animation: pulse-ring 1.5s infinite;
  }

  .record-btn.recording .mic-icon { color: var(--danger); }

  .mic-icon { color: var(--accent); transition: color 0.3s; }

  /* Pulse rings */
  @keyframes pulse-ring {
    0% { box-shadow: 0 0 0 0 rgba(239,68,68,0.4); }
    70% { box-shadow: 0 0 0 20px rgba(239,68,68,0); }
    100% { box-shadow: 0 0 0 0 rgba(239,68,68,0); }
  }

  .record-status {
    font-family: 'Space Mono', monospace;
    font-size: 0.75rem;
    color: var(--muted);
    letter-spacing: 0.08em;
  }

  .record-status.recording { color: var(--danger); }

  /* Waveform */
  .waveform {
    display: flex;
    align-items: center;
    gap: 3px;
    height: 32px;
    opacity: 0;
    transition: opacity 0.3s;
  }

  .waveform.active { opacity: 1; }

  .wave-bar {
    width: 3px;
    background: var(--accent);
    border-radius: 2px;
    height: 4px;
    transition: height 0.1s;
  }

  .waveform.active .wave-bar {
    animation: wave 0.8s ease-in-out infinite;
  }

  .wave-bar:nth-child(1) { animation-delay: 0s; }
  .wave-bar:nth-child(2) { animation-delay: 0.1s; }
  .wave-bar:nth-child(3) { animation-delay: 0.2s; }
  .wave-bar:nth-child(4) { animation-delay: 0.3s; }
  .wave-bar:nth-child(5) { animation-delay: 0.4s; }
  .wave-bar:nth-child(6) { animation-delay: 0.3s; }
  .wave-bar:nth-child(7) { animation-delay: 0.2s; }
  .wave-bar:nth-child(8) { animation-delay: 0.1s; }
  .wave-bar:nth-child(9) { animation-delay: 0s; }

  @keyframes wave {
    0%, 100% { height: 4px; }
    50% { height: 24px; }
  }

  /* History */
  .history-section {
    animation: fadeUp 0.6s 0.4s both;
  }

  .history-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 0.75rem;
  }

  .section-title {
    font-family: 'Space Mono', monospace;
    font-size: 0.7rem;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.12em;
  }

  .clear-btn {
    background: none;
    border: none;
    color: var(--muted);
    cursor: pointer;
    font-size: 0.75rem;
    font-family: 'Space Mono', monospace;
    transition: color 0.2s;
  }

  .clear-btn:hover { color: var(--danger); }

  .history-list {
    display: flex;
    flex-direction: column;
    gap: 0.5rem;
    max-height: 280px;
    overflow-y: auto;
    padding-right: 4px;
  }

  .history-list::-webkit-scrollbar { width: 4px; }
  .history-list::-webkit-scrollbar-track { background: transparent; }
  .history-list::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

  .history-item {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 0.75rem 1rem;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 0.75rem;
    animation: slideIn 0.3s ease;
  }

  .history-original {
    font-size: 0.85rem;
    color: var(--muted);
    border-right: 1px solid var(--border);
    padding-right: 0.75rem;
  }

  .history-translated {
    font-size: 0.85rem;
    color: var(--text);
  }

  .history-meta {
    font-family: 'Space Mono', monospace;
    font-size: 0.6rem;
    color: var(--muted);
    opacity: 0.6;
    margin-top: 0.2rem;
  }

  .empty-history {
    text-align: center;
    padding: 2rem;
    color: var(--muted);
    font-size: 0.85rem;
  }

  /* Toast */
  .toast {
    position: fixed;
    bottom: 2rem;
    left: 50%;
    transform: translateX(-50%) translateY(100px);
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 0.75rem 1.25rem;
    font-family: 'Space Mono', monospace;
    font-size: 0.8rem;
    color: var(--text);
    transition: transform 0.3s;
    z-index: 100;
    white-space: nowrap;
  }

  .toast.show { transform: translateX(-50%) translateY(0); }
  .toast.error { border-color: var(--danger); color: var(--danger); }
  .toast.success { border-color: var(--success); color: var(--success); }

  /* Animations */
  @keyframes fadeDown {
    from { opacity: 0; transform: translateY(-20px); }
    to { opacity: 1; transform: translateY(0); }
  }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(20px); }
    to { opacity: 1; transform: translateY(0); }
  }

  @keyframes slideIn {
    from { opacity: 0; transform: translateX(-10px); }
    to { opacity: 1; transform: translateX(0); }
  }

  @keyframes blink {
    0%, 100% { opacity: 1; }
    50% { opacity: 0; }
  }

  /* Char counter */
  .char-count {
    font-family: 'Space Mono', monospace;
    font-size: 0.65rem;
    color: var(--muted);
    text-align: right;
  }

  /* API Key Banner */
  .apikey-banner {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 1.1rem 1.25rem;
    margin-bottom: 1.25rem;
    animation: fadeDown 0.5s ease;
  }
  .apikey-banner.has-key {
    border-color: var(--success);
    background: rgba(34,197,94,0.04);
  }
  .apikey-top {
    display: flex;
    align-items: center;
    gap: 0.6rem;
    margin-bottom: 0.7rem;
  }
  .apikey-icon {
    font-size: 1rem;
    width: 28px; height: 28px;
    background: rgba(0,229,255,0.1);
    border-radius: 7px;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
  }
  .apikey-title {
    font-family: 'Space Mono', monospace;
    font-size: 0.72rem;
    color: var(--text);
    letter-spacing: 0.06em;
  }
  .apikey-status {
    margin-left: auto;
    font-family: 'Space Mono', monospace;
    font-size: 0.62rem;
    padding: 0.15rem 0.55rem;
    border-radius: 5px;
    background: rgba(100,116,139,0.15);
    color: var(--muted);
    letter-spacing: 0.06em;
  }
  .apikey-banner.has-key .apikey-status {
    background: rgba(34,197,94,0.15);
    color: var(--success);
  }
  .apikey-row {
    display: flex;
    gap: 0.5rem;
  }
  .apikey-input {
    flex: 1;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 9px;
    padding: 0.6rem 0.9rem;
    color: var(--text);
    font-family: 'Space Mono', monospace;
    font-size: 0.78rem;
    outline: none;
    transition: border-color 0.2s;
    letter-spacing: 0.04em;
  }
  .apikey-input:focus { border-color: var(--accent); }
  .apikey-input::placeholder { color: var(--muted); font-size: 0.72rem; }
  .apikey-save {
    background: var(--accent);
    border: none;
    border-radius: 9px;
    color: var(--bg);
    font-family: 'Space Mono', monospace;
    font-size: 0.75rem;
    font-weight: 700;
    padding: 0 1.1rem;
    cursor: pointer;
    transition: opacity 0.2s;
    white-space: nowrap;
  }
  .apikey-save:hover { opacity: 0.85; }
  .apikey-hint {
    font-size: 0.68rem;
    color: var(--muted);
    margin-top: 0.5rem;
    line-height: 1.5;
  }
  .apikey-hint a { color: var(--accent); text-decoration: none; }

  /* AI Correction */
  .correction-toggle {
    display: flex;
    align-items: center;
    gap: 0.5rem;
    padding: 0.6rem 1rem;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 10px;
    margin-bottom: 1rem;
    animation: fadeUp 0.6s 0.15s both;
    cursor: pointer;
    user-select: none;
    transition: border-color 0.2s;
  }
  .correction-toggle:hover { border-color: var(--accent3); }
  .correction-toggle.on { border-color: var(--accent3); background: rgba(245,158,11,0.05); }

  .toggle-switch {
    width: 36px; height: 20px;
    background: var(--border);
    border-radius: 10px;
    position: relative;
    transition: background 0.2s;
    flex-shrink: 0;
  }
  .toggle-switch::after {
    content: '';
    position: absolute;
    width: 14px; height: 14px;
    background: #fff;
    border-radius: 50%;
    top: 3px; left: 3px;
    transition: transform 0.2s;
  }
  .correction-toggle.on .toggle-switch { background: var(--accent3); }
  .correction-toggle.on .toggle-switch::after { transform: translateX(16px); }

  .toggle-label {
    font-family: 'Space Mono', monospace;
    font-size: 0.72rem;
    color: var(--muted);
    letter-spacing: 0.06em;
  }
  .correction-toggle.on .toggle-label { color: var(--accent3); }

  .toggle-badge {
    margin-left: auto;
    font-size: 0.6rem;
    font-family: 'Space Mono', monospace;
    padding: 0.15rem 0.5rem;
    border-radius: 4px;
    background: rgba(245,158,11,0.15);
    color: var(--accent3);
    letter-spacing: 0.08em;
  }

  /* Diff highlight */
  .diff-box {
    display: none;
    background: rgba(245,158,11,0.06);
    border: 1px solid rgba(245,158,11,0.2);
    border-radius: 10px;
    padding: 0.75rem 1rem;
    font-size: 0.82rem;
    line-height: 1.7;
    margin-top: 0.3rem;
  }
  .diff-box.show { display: block; animation: fadeUp 0.3s ease; }
  .diff-label {
    font-family: 'Space Mono', monospace;
    font-size: 0.6rem;
    color: var(--accent3);
    letter-spacing: 0.1em;
    margin-bottom: 0.4rem;
    text-transform: uppercase;
  }
  .diff-original { color: var(--muted); text-decoration: line-through; margin-bottom: 0.25rem; }
  .diff-corrected { color: var(--text); }
  mark {
    background: rgba(245,158,11,0.25);
    color: var(--accent3);
    border-radius: 3px;
    padding: 0 2px;
    font-weight: 700;
  }
</style>
</head>
<body>

<div class="container">
  <header>
    <div class="logo">
      <div class="logo-icon">🌐</div>
    </div>
    <h1>VOICE TRANSLATOR</h1>
    <p class="subtitle">// AI 語音即時翻譯 · Powered by Claude</p>
  </header>

  <!-- API Key Banner -->
  <div class="apikey-banner" id="apikeyBanner">
    <div class="apikey-top">
      <div class="apikey-icon">🔑</div>
      <span class="apikey-title">Anthropic API Key</span>
      <span class="apikey-status" id="apikeyStatus">未設定</span>
    </div>
    <div class="apikey-row">
      <input class="apikey-input" id="apikeyInput" type="password"
        placeholder="sk-ant-api03-..." autocomplete="off" spellcheck="false"
        oninput="onApiKeyInput()" onkeydown="if(event.key==='Enter')saveApiKey()" />
      <button class="apikey-save" onclick="saveApiKey()">儲存</button>
    </div>
    <div class="apikey-hint">
      金鑰僅儲存在瀏覽器本機，不會上傳任何伺服器。
      前往 <a href="https://console.anthropic.com/keys" target="_blank">console.anthropic.com</a> 取得金鑰。
    </div>
  </div>

  <!-- AI Correction Toggle -->
  <div class="correction-toggle" id="correctionToggle" onclick="toggleCorrection()">
    <div class="toggle-switch"></div>
    <span class="toggle-label">AI 語音辨識校正（自動修正聽錯的字）</span>
    <span class="toggle-badge">✦ AI</span>
  </div>

  <!-- Language Bar -->
  <div class="lang-bar">
    <div class="lang-select-wrap">
      <span class="lang-label">來源語言 Source</span>
      <select id="sourceLang">
        <option value="zh-TW">繁體中文</option>
        <option value="zh-CN">简体中文</option>
        <option value="en-US" selected>English</option>
        <option value="ja-JP">日本語</option>
        <option value="ko-KR">한국어</option>
        <option value="fr-FR">Français</option>
        <option value="de-DE">Deutsch</option>
        <option value="es-ES">Español</option>
        <option value="th-TH">ภาษาไทย</option>
        <option value="vi-VN">Tiếng Việt</option>
      </select>
    </div>

    <button class="swap-btn" onclick="swapLanguages()" title="交換語言">⇄</button>

    <div class="lang-select-wrap">
      <span class="lang-label">目標語言 Target</span>
      <select id="targetLang">
        <option value="zh-TW" selected>繁體中文</option>
        <option value="zh-CN">简体中文</option>
        <option value="en-US">English</option>
        <option value="ja-JP">日本語</option>
        <option value="ko-KR">한국어</option>
        <option value="fr-FR">Français</option>
        <option value="de-DE">Deutsch</option>
        <option value="es-ES">Español</option>
        <option value="th-TH">ภาษาไทย</option>
        <option value="vi-VN">Tiếng Việt</option>
      </select>
    </div>
  </div>

  <!-- Text Panels -->
  <div class="panels">
    <div class="panel" id="sourcePanel">
      <div class="panel-header">
        <span class="panel-title">原文 Original</span>
        <div class="panel-actions">
          <button class="icon-btn" onclick="clearSource()" title="清除">✕</button>
          <button class="icon-btn" onclick="translateText()" title="翻譯">→</button>
        </div>
      </div>
      <textarea class="text-area" id="sourceText" placeholder="輸入文字或點擊下方麥克風開始語音輸入..." oninput="onSourceInput()" rows="6"></textarea>
      <div class="char-count" id="charCount">0 字元</div>
      <div class="diff-box" id="diffBox">
        <div class="diff-label">✦ AI 校正記錄</div>
        <div class="diff-original" id="diffOriginal"></div>
        <div class="diff-corrected" id="diffCorrected"></div>
      </div>
    </div>

    <div class="panel" id="targetPanel">
      <div class="panel-header">
        <span class="panel-title">譯文 Translation</span>
        <div class="panel-actions">
          <button class="icon-btn" onclick="speakTranslation()" title="朗讀">🔊</button>
          <button class="icon-btn" onclick="copyTranslation()" title="複製">📋</button>
        </div>
      </div>
      <div class="translated-text placeholder" id="translatedText">翻譯結果將顯示在這裡...</div>
    </div>
  </div>

  <!-- Record Controls -->
  <div class="controls">
    <div class="waveform" id="waveform">
      <div class="wave-bar"></div><div class="wave-bar"></div>
      <div class="wave-bar"></div><div class="wave-bar"></div>
      <div class="wave-bar"></div><div class="wave-bar"></div>
      <div class="wave-bar"></div><div class="wave-bar"></div>
      <div class="wave-bar"></div>
    </div>

    <button class="record-btn" id="recordBtn" onclick="toggleRecording()">
      <span class="mic-icon" id="micIcon">🎙️</span>
    </button>

    <div class="record-status" id="recordStatus">點擊麥克風開始錄音</div>
  </div>

  <!-- History -->
  <div class="history-section">
    <div class="history-header">
      <span class="section-title">翻譯記錄 History</span>
      <button class="clear-btn" onclick="clearHistory()">清除記錄</button>
    </div>
    <div class="history-list" id="historyList">
      <div class="empty-history">尚無翻譯記錄</div>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
// ── State ──────────────────────────────────────────────
let recognition = null;
let isRecording = false;
let translateTimer = null;
let history = [];
let isSpeaking = false;
let correctionEnabled = false;
let apiKey = '';

// ── API Key Management ─────────────────────────────────
function initApiKey() {
  const saved = localStorage.getItem('vt_apikey') || '';
  if (saved) {
    apiKey = saved;
    document.getElementById('apikeyInput').value = saved;
    setApiKeyUI(true);
  }
}

function onApiKeyInput() {
  const val = document.getElementById('apikeyInput').value.trim();
  if (!val) { apiKey = ''; setApiKeyUI(false); }
}

function saveApiKey() {
  const val = document.getElementById('apikeyInput').value.trim();
  if (!val) { showToast('請輸入 API Key', 'error'); return; }
  if (!val.startsWith('sk-ant-')) { showToast('格式不正確，應以 sk-ant- 開頭', 'error'); return; }
  apiKey = val;
  localStorage.setItem('vt_apikey', val);
  setApiKeyUI(true);
  showToast('✓ API Key 已儲存', 'success');
}

function setApiKeyUI(hasKey) {
  const banner = document.getElementById('apikeyBanner');
  const status = document.getElementById('apikeyStatus');
  if (hasKey) {
    banner.classList.add('has-key');
    const masked = apiKey.slice(0, 10) + '···' + apiKey.slice(-4);
    status.textContent = '✓ ' + masked;
  } else {
    banner.classList.remove('has-key');
    status.textContent = '未設定';
  }
}

function getHeaders() {
  if (!apiKey) throw new Error('請先設定 API Key');
  return { 'Content-Type': 'application/json', 'x-api-key': apiKey, 'anthropic-version': '2023-06-01', 'anthropic-dangerous-direct-browser-access': 'true' };
}

// ── Toggle Correction ──────────────────────────────────
function toggleCorrection() {
  correctionEnabled = !correctionEnabled;
  const el = document.getElementById('correctionToggle');
  el.classList.toggle('on', correctionEnabled);
  showToast(correctionEnabled ? '✦ AI 校正已開啟' : 'AI 校正已關閉', correctionEnabled ? 'success' : '');
  if (!correctionEnabled) {
    document.getElementById('diffBox').classList.remove('show');
  }
}

// ── AI Correction ──────────────────────────────────────
async function correctText(rawText, langCode) {
  const langNames = {
    'zh-TW': '繁體中文', 'zh-CN': '简体中文', 'en-US': 'English',
    'ja-JP': '日本語', 'ko-KR': '한국어', 'fr-FR': 'Français',
    'de-DE': 'Deutsch', 'es-ES': 'Español', 'th-TH': 'ภาษาไทย', 'vi-VN': 'Tiếng Việt'
  };
  const lang = langNames[langCode] || langCode;

  const resp = await fetch('https://api.anthropic.com/v1/messages', {
    method: 'POST',
    headers: getHeaders(),
    body: JSON.stringify({
      model: 'claude-sonnet-4-20250514',
      max_tokens: 1000,
      messages: [{
        role: 'user',
        content: `You are a speech-recognition correction engine for ${lang}.
The following text was produced by a speech recognizer and may contain errors such as:
- Wrong kanji/characters chosen due to homophones
- Missing or wrong particles/grammar words
- Mis-transcribed words due to accent or noise

Correct ONLY genuine speech-recognition mistakes. Do NOT paraphrase, rewrite, or change the meaning.
If the text looks correct already, return it as-is.

Respond with a JSON object ONLY (no markdown, no explanation):
{"corrected": "<corrected text>", "changed": true/false, "changes": "<brief description of what was fixed, in Traditional Chinese, or empty string if nothing changed>"}

Text to correct:
${rawText}`
      }]
    })
  });

  const data = await resp.json();
  if (data.error) throw new Error(data.error.message);
  const raw = data.content[0].text.trim().replace(/```json|```/g, '').trim();
  return JSON.parse(raw);
}

// ── Speech Recognition Setup ───────────────────────────
function setupRecognition() {
  const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SpeechRecognition) {
    showToast('❌ 此瀏覽器不支援語音辨識，請使用 Chrome', 'error');
    document.getElementById('recordBtn').disabled = true;
    return null;
  }

  const rec = new SpeechRecognition();
  rec.continuous = true;
  rec.interimResults = true;

  rec.onresult = (e) => {
    let interim = '', final = '';
    for (let i = e.resultIndex; i < e.results.length; i++) {
      const t = e.results[i][0].transcript;
      if (e.results[i].isFinal) final += t;
      else interim += t;
    }

    const textarea = document.getElementById('sourceText');
    const base = textarea.dataset.base || '';
    textarea.value = base + final + interim;
    if (final) textarea.dataset.base = base + final;

    updateCharCount();
    scheduleTranslate();
  };

  rec.onerror = (e) => {
    if (e.error !== 'no-speech') {
      showToast('語音辨識錯誤: ' + e.error, 'error');
      stopRecording();
    }
  };

  rec.onend = () => {
    if (isRecording) rec.start(); // auto-restart
  };

  return rec;
}

// ── Recording ──────────────────────────────────────────
function toggleRecording() {
  if (isRecording) stopRecording();
  else startRecording();
}

function startRecording() {
  if (!recognition) recognition = setupRecognition();
  if (!recognition) return;

  const lang = document.getElementById('sourceLang').value;
  recognition.lang = lang;
  recognition.start();
  isRecording = true;

  document.getElementById('recordBtn').classList.add('recording');
  document.getElementById('micIcon').textContent = '⏹';
  document.getElementById('recordStatus').textContent = '錄音中... 請說話';
  document.getElementById('recordStatus').classList.add('recording');
  document.getElementById('waveform').classList.add('active');
  document.getElementById('sourcePanel').classList.add('active');
}

function stopRecording() {
  if (recognition) {
    recognition.stop();
    recognition.onend = null;
  }
  isRecording = false;

  document.getElementById('recordBtn').classList.remove('recording');
  document.getElementById('micIcon').textContent = '🎙️';
  document.getElementById('recordStatus').textContent = '點擊麥克風開始錄音';
  document.getElementById('recordStatus').classList.remove('recording');
  document.getElementById('waveform').classList.remove('active');
  document.getElementById('sourcePanel').classList.remove('active');

  // Final translate
  const text = document.getElementById('sourceText').value.trim();
  if (text) translateText();
}

// ── Translation ────────────────────────────────────────
function scheduleTranslate() {
  clearTimeout(translateTimer);
  translateTimer = setTimeout(() => {
    const text = document.getElementById('sourceText').value.trim();
    if (text) translateText();
  }, 800);
}

async function translateText() {
  let sourceText = document.getElementById('sourceText').value.trim();
  if (!sourceText) return;

  const sourceLang = document.getElementById('sourceLang').value;
  const targetLang = document.getElementById('targetLang').value;

  const langNames = {
    'zh-TW': '繁體中文', 'zh-CN': '简体中文', 'en-US': 'English',
    'ja-JP': '日本語', 'ko-KR': '한국어', 'fr-FR': 'Français',
    'de-DE': 'Deutsch', 'es-ES': 'Español', 'th-TH': 'ภาษาไทย', 'vi-VN': 'Tiếng Việt'
  };

  const outputEl = document.getElementById('translatedText');
  outputEl.className = 'translated-text loading';
  document.getElementById('targetPanel').classList.add('active');

  // ── Step 1: AI Correction (if enabled) ──
  const diffBox = document.getElementById('diffBox');
  if (correctionEnabled) {
    outputEl.innerHTML = '🔍 AI 校正中<span class="cursor"></span>';
    try {
      const result = await correctText(sourceText, sourceLang);
      if (result.changed && result.corrected !== sourceText) {
        const original = sourceText;
        sourceText = result.corrected;
        // Update textarea with corrected text
        document.getElementById('sourceText').value = sourceText;
        document.getElementById('sourceText').dataset.base = sourceText;
        updateCharCount();
        // Show diff
        document.getElementById('diffOriginal').innerHTML = '原始：' + highlightDiff(original, sourceText);
        document.getElementById('diffCorrected').innerHTML = '✓ 校正：<strong>' + escHtml(sourceText) + '</strong>' +
          (result.changes ? ' <span style="color:var(--muted);font-size:0.75em;">（' + escHtml(result.changes) + '）</span>' : '');
        diffBox.classList.add('show');
      } else {
        diffBox.classList.remove('show');
      }
    } catch (e) {
      console.warn('Correction failed, proceeding without:', e);
      diffBox.classList.remove('show');
    }
  } else {
    diffBox.classList.remove('show');
  }

  // ── Step 2: Translate ──
  outputEl.innerHTML = '翻譯中<span class="cursor"></span>';

  try {
    const response = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      headers: getHeaders(),
      body: JSON.stringify({
        model: 'claude-sonnet-4-20250514',
        max_tokens: 1000,
        messages: [{
          role: 'user',
          content: `Translate the following text from ${langNames[sourceLang]} to ${langNames[targetLang]}. Return ONLY the translated text, no explanation, no quotes, no extra formatting.\n\nText to translate:\n${sourceText}`
        }]
      })
    });

    const data = await response.json();
    if (data.error) throw new Error(data.error.message);

    const translated = data.content[0].text.trim();
    outputEl.className = 'translated-text';
    outputEl.textContent = translated;
    document.getElementById('targetPanel').classList.remove('active');

    // Add to history
    addHistory(sourceText, translated, langNames[sourceLang], langNames[targetLang]);

  } catch (err) {
    outputEl.className = 'translated-text placeholder';
    outputEl.textContent = '翻譯失敗，請確認網路連線或 API 授權。';
    showToast('翻譯失敗: ' + err.message, 'error');
    document.getElementById('targetPanel').classList.remove('active');
  }
}

// Highlight differing words between original and corrected
function highlightDiff(original, corrected) {
  const ow = original.split(''), cw = corrected.split('');
  // Simple char-level: mark chars not in corrected
  if (original === corrected) return escHtml(original);
  // Use word-level for CJK won't work well, just show original with changed chars marked
  let out = '';
  const maxLen = Math.max(ow.length, cw.length);
  for (let i = 0; i < ow.length; i++) {
    if (ow[i] !== cw[i]) out += `<mark>${escHtml(ow[i])}</mark>`;
    else out += escHtml(ow[i]);
  }
  return out;
}

// ── History ────────────────────────────────────────────
function addHistory(original, translated, srcName, tgtName) {
  history.unshift({ original, translated, srcName, tgtName, time: new Date() });
  if (history.length > 20) history.pop();
  renderHistory();
}

function renderHistory() {
  const list = document.getElementById('historyList');
  if (history.length === 0) {
    list.innerHTML = '<div class="empty-history">尚無翻譯記錄</div>';
    return;
  }

  list.innerHTML = history.map((item, i) => `
    <div class="history-item">
      <div class="history-original">
        ${escHtml(item.original.slice(0, 100))}${item.original.length > 100 ? '…' : ''}
        <div class="history-meta">${item.srcName}</div>
      </div>
      <div class="history-translated">
        ${escHtml(item.translated.slice(0, 100))}${item.translated.length > 100 ? '…' : ''}
        <div class="history-meta">${item.tgtName} · ${formatTime(item.time)}</div>
      </div>
    </div>
  `).join('');
}

function clearHistory() {
  history = [];
  renderHistory();
  showToast('記錄已清除', 'success');
}

// ── Utilities ──────────────────────────────────────────
function clearSource() {
  document.getElementById('sourceText').value = '';
  document.getElementById('sourceText').dataset.base = '';
  updateCharCount();
  document.getElementById('translatedText').className = 'translated-text placeholder';
  document.getElementById('translatedText').textContent = '翻譯結果將顯示在這裡...';
}

function onSourceInput() {
  updateCharCount();
  scheduleTranslate();
}

function updateCharCount() {
  const len = document.getElementById('sourceText').value.length;
  document.getElementById('charCount').textContent = `${len} 字元`;
}

async function copyTranslation() {
  const text = document.getElementById('translatedText').textContent;
  if (!text || text === '翻譯結果將顯示在這裡...') return;
  try {
    await navigator.clipboard.writeText(text);
    showToast('✓ 已複製到剪貼簿', 'success');
  } catch {
    showToast('複製失敗', 'error');
  }
}

function speakTranslation() {
  const text = document.getElementById('translatedText').textContent;
  if (!text || text === '翻譯結果將顯示在這裡...') return;
  const targetLang = document.getElementById('targetLang').value.split('-')[0];

  window.speechSynthesis.cancel();
  const utt = new SpeechSynthesisUtterance(text);
  utt.lang = document.getElementById('targetLang').value;
  window.speechSynthesis.speak(utt);
  showToast('🔊 朗讀中...', 'success');
}

function swapLanguages() {
  const src = document.getElementById('sourceLang');
  const tgt = document.getElementById('targetLang');
  const tmp = src.value;
  src.value = tgt.value;
  tgt.value = tmp;

  // Swap texts too
  const srcText = document.getElementById('sourceText').value;
  const tgtText = document.getElementById('translatedText').textContent;
  if (tgtText && tgtText !== '翻譯結果將顯示在這裡...') {
    document.getElementById('sourceText').value = tgtText;
    document.getElementById('sourceText').dataset.base = tgtText;
    updateCharCount();
    scheduleTranslate();
  }
}

function showToast(msg, type = '') {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast show' + (type ? ' ' + type : '');
  clearTimeout(t._timer);
  t._timer = setTimeout(() => t.className = 'toast', 2800);
}

function escHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function formatTime(d) {
  return d.toLocaleTimeString('zh-TW', { hour: '2-digit', minute: '2-digit' });
}

// Init
initApiKey();
</script>
</body>
</html>
